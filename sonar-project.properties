# SonarQube Cloud Configuration
#
# projectKey convention: `{sonarcloud org}_{repo}`, matching SonarCloud's own
# GitHub-import default and keeping the key unique across all of SonarCloud.
#
# This repo is the vxture-foundation org's independent copy of vxture/vxture-
# atlas (single-commit migration, no shared history/CI with the original).
# The original repo's SonarCloud project (org key
# vx-6b309295f6500aba6b2a71a29ee27de77fa41583, project vxture_vxture-atlas)
# never actually completed an analysis - the vxture Sonar org's Free-plan
# private-LOC quota was exhausted org-wide (see the original repo's TD-027).
# Pointing this file at a fresh vxture-foundation Sonar org (own quota, not
# shared with the old org) is what gets Atlas its first real scan.
#
# A key is NOT derived from the repo at analysis time - it is frozen at
# import and a repo rename updates only the Sonar display name.
sonar.projectKey=vxture-foundation_vxture-atlas
sonar.organization=vxture-foundation
sonar.host.url=https://sonarcloud.io

# projectName is the DISPLAY name, and the scanner owns it: SonarCloud has no
# UI and no API to rename a project (`api/webservices/list` offers update_key,
# update_visibility, create, delete - and nothing else), so whatever this file
# declares is written on every analysis. It must therefore match the repo name
# for the same reason projectKey does.
sonar.projectName=vxture-atlas
sonar.projectVersion=0.1.0

# Single-service repo (services profile, product_240 section 2.5) - no
# packages/portals to enumerate like the platform monorepo.
sonar.sources=service/src
sonar.tests=service/src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  service/src/generated/**

sonar.javascript.lcov.reportPaths=service/coverage/lcov.info

sonar.sourceEncoding=UTF-8
