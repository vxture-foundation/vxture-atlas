name: secret-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check which secrets actually resolve
        env:
          A: ${{ secrets.NODE_AUTH_TOKEN }}
          B: ${{ secrets.ALIYUN_ACR_USERNAME }}
          C: ${{ secrets.ALIYUN_ACR_PASSWORD }}
          D: ${{ secrets.DEPLOY_WORKER02_HOST }}
          E: ${{ secrets.DEPLOY_WORKER02_USER }}
          F: ${{ secrets.DEPLOY_WORKER02_PORT }}
          G: ${{ secrets.DEPLOY_WORKER02_SSH_KEY }}
          H: ${{ secrets.DEPLOY_WORKER02_SSH_KEY_PASSPHRASE }}
          I: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          J: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
        run: |
          check() { if [ -n "$2" ]; then echo "$1 = VISIBLE"; else echo "$1 = EMPTY (org secret not usable on this plan/repo)"; fi }
          check NODE_AUTH_TOKEN "$A"
          check ALIYUN_ACR_USERNAME "$B"
          check ALIYUN_ACR_PASSWORD "$C"
          check DEPLOY_WORKER02_HOST "$D"
          check DEPLOY_WORKER02_USER "$E"
          check DEPLOY_WORKER02_PORT "$F"
          check DEPLOY_WORKER02_SSH_KEY "$G"
          check DEPLOY_WORKER02_SSH_KEY_PASSPHRASE "$H"
          check TAILSCALE_OAUTH_CLIENT_ID "$I"
          check TAILSCALE_OAUTH_CLIENT_SECRET "$J"
